name: Verify and package Android installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Fetch corresponding public source
        run: |
          curl --fail --location --retry 2 -o source.zip https://github.com/systemzayu-hub/ZayGym/releases/download/android-teste-2026-10-14/ZayGym-source-2026-10-14.zip
          echo "604cdbcf2c5b4d144549632422b6901014cac6f8f195aa9ea80236266ee7f7df  source.zip" | sha256sum --check
          unzip -q source.zip
          curl --fail --location --retry 2 -o original.apk https://systemzayu-hub.github.io/ZayGym/ZayGym.apk
          echo "c4a80d0573d5af22e60658a297d183668b09b5eae07ceb530950e829ed206277  original.apk" | sha256sum --check
      - name: Build the existing application
        working-directory: ZayGym/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:mobile
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Sign distribution APK
        env:
          SIGNING_STORE: ${{ secrets.ZAYGYM_TEST_SIGNING_STORE }}
        run: |
          test -n "$SIGNING_STORE"
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/zaygym.jks"
          sdkmanager "build-tools;35.0.0" > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 ZayGym/frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/zaygym.jks" --ks-pass pass:android --key-pass pass:android --out ZayGym-instalar.apk "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/zaygym.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ZayGym-instalar.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging ZayGym-instalar.apk | head -3
          sha256sum ZayGym-instalar.apk > SHA256SUMS-instalar.txt
      - name: Enable Android virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the downloaded original APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install original.apk
            adb shell am start -W -n com.zaygym.app.test/com.zaygym.app.MainActivity
            sleep 8
            adb shell pidof com.zaygym.app.test
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml original-ui.xml
            adb shell screencap -p /sdcard/installed.png
            adb pull /sdcard/installed.png original-installed.png
            adb logcat -d -s AndroidRuntime > android-runtime.log
            adb install ZayGym-instalar.apk
            adb shell am start -W -n com.zaygym.app/com.zaygym.app.MainActivity
            sleep 8
            adb shell pidof com.zaygym.app
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml distribution-ui.xml
            adb shell screencap -p /sdcard/distribution.png
            adb pull /sdcard/distribution.png distribution-installed.png
      - name: Retain installer and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZayGym-Android-tested
          retention-days: 7
          path: |
            ZayGym-instalar.apk
            SHA256SUMS-instalar.txt
            *-ui.xml
            *-installed.png
            android-runtime.log
